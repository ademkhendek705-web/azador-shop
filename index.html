<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZADOR | Old Money Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F9F6F0;
            --text-main: #2C221E;
            --accent-gold: #C5A059;
            --card-bg: #FFFFFF;
            --border-color: #E6DFD5;
        }

        /* الثيمات الجاهزة */
        body.theme-royal {
            --bg-color: #0F172A;
            --text-main: #F8FAFC;
            --accent-gold: #CBD5E1;
            --card-bg: #1E293B;
            --border-color: #334155;
        }

        body.theme-emerald {
            --bg-color: #064E3B;
            --text-main: #ECFDF5;
            --accent-gold: #D1FAE5;
            --card-bg: #047857;
            --border-color: #059669;
        }

        body.theme-dark {
            --bg-color: #121212;
            --text-main: #E5E0D8;
            --accent-gold: #C5A059;
            --card-bg: #1E1E1E;
            --border-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* شريط التحكم العلوي */
        .settings-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            padding: 12px 25px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
            flex-wrap: wrap;
        }

        .settings-bar label {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .settings-bar select, .color-picker-input {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            outline: none;
        }

        .color-picker-input {
            padding: 0;
            width: 30px;
            height: 25px;
            border: none;
            background: none;
            cursor: pointer;
        }

        header {
            text-align: center;
            padding: 30px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .brand-logo:hover {
            transform: scale(1.05);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            letter-spacing: 5px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            transition: all 0.3s ease;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            transition: transform 0.4s ease, box-shadow 0.4s ease, background-color 0.4s ease;
        }

        .product-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            border-color: var(--accent-gold);
        }

        .image-container {
            width: 100%;
            height: 300px;
            background-color: rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 15px;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.6s ease;
        }

        .product-card:hover .image-container img {
            transform: scale(1.06);
        }

        .product-info {
            padding: 20px;
            text-align: center;
        }

        .product-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .product-price {
            font-size: 0.95rem;
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .btn-commander {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--text-main);
            color: var(--bg-color);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-weight: 500;
            border-radius: 2px;
            transition: all 0.3s ease;
            border: 1px solid var(--text-main);
        }

        .btn-commander:hover {
            background-color: transparent;
            color: var(--text-main);
            border-color: var(--accent-gold);
        }

        @media (max-width: 600px) {
            .settings-bar {
                justify-content: center;
                padding: 10px;
            }
            header h1 {
                font-size: 1.8rem;
            }
            .brand-logo {
                width: 75px;
                height: 75px;
            }
        }

        @keyframes fadeInDown {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="settings-bar">
        <label for="themeSelect">Thème:</label>
        <select id="themeSelect">
            <option value="classic">Classic Ivory (الفخم)</option>
            <option value="dark">Noir Luxe (أسود)</option>
            <option value="royal">Bleu Royal (أزرق)</option>
            <option value="emerald">Vert Émeraude (أخضر)</option>
        </select>

        <label for="customBg">Couleur:</label>
        <input type="color" id="customBg" class="color-picker-input" value="#F9F6F0">

        <select id="currencySelect">
            <option value="DZD">DZD (د.ج)</option>
            <option value="EUR">EUR (€)</option>
            <option value="USD">USD ($)</option>
        </select>
    </div>

    <header>
        <img src="images/logo.jpg.jfif" onerror="this.src='images/logo.jpg'" alt="AZADOR Logo" class="brand-logo">
        <h1>AZADOR</h1>
        <p>Old Money Collection</p>
    </header>

    <div class="container" id="productContainer">
        <!-- Produit 1 -->
        <div class="product-card">
            <div class="image-container">
                <img src="images/polo.jpg.jpg" onerror="this.src='images/polo.jpg'" alt="Classic Knit Polo Navy">
            </div>
            <div class="product-info">
                <div class="product-title">CLASSIC POLO - NAVY</div>
                <div class="product-price" data-base-price="4500">4500 DA</div>
                <a href="checkout.html?item=polo1" class="btn-commander">Commander</a>
            </div>
        </div>

        <!-- Produit 2 -->
        <div class="product-card">
            <div class="image-container">
                <img src="images/polo1.jpg.jfif" onerror="this.src='images/polo1.jpg'" alt="Classic Knit Polo Ivory">
            </div>
            <div class="product-info">
                <div class="product-title">CLASSIC POLO - IVORY</div>
                <div class="product-price" data-base-price="4500">4500 DA</div>
                <a href="checkout.html?item=polo2" class="btn-commander">Commander</a>
            </div>
        </div>

        <!-- Produit 3 -->
        <div class="product-card">
            <div class="image-container">
                <img src="images/polo2.jpg.jfif" onerror="this.src='images/polo2.jpg'" alt="Classic Knit Polo Black">
            </div>
            <div class="product-info">
                <div class="product-title">CLASSIC POLO - ESPRESSO</div>
                <div class="product-price" data-base-price="4500">4500 DA</div>
                <a href="checkout.html?item=polo3" class="btn-commander">Commander</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const themeSelect = document.getElementById('themeSelect');
            const customBg = document.getElementById('customBg');
            const currencySelect = document.getElementById('currencySelect');
            const priceElements = document.querySelectorAll('.product-price');

            themeSelect.addEventListener('change', (e) => {
                document.body.className = ''; 
                document.documentElement.style.removeProperty('--bg-color'); 
                
                const val = e.target.value;
                if (val !== 'classic') {
                    document.body.classList.add(`theme-${val}`);
                }
                localStorage.setItem('azador_theme_preset', val);
            });

            customBg.addEventListener('input', (e) => {
                document.body.className = ''; 
                document.documentElement.style.setProperty('--bg-color', e.target.value);
                localStorage.setItem('azador_custom_bg', e.target.value);
            });

            const savedTheme = localStorage.getItem('azador_theme_preset');
            const savedBg = localStorage.getItem('azador_custom_bg');

            if (savedBg) {
                document.documentElement.style.setProperty('--bg-color', savedBg);
                customBg.value = savedBg;
            } else if (savedTheme) {
                themeSelect.value = savedTheme;
                themeSelect.dispatchEvent(new Event('change'));
            }

            const rates = { DZD: 1, EUR: 0.0068, USD: 0.0075 };
            const symbols = { DZD: 'DA', EUR: '€', USD: '$' };

            currencySelect.addEventListener('change', (e) => {
                const curr = e.target.value;
                priceElements.forEach(el => {
                    const base = parseFloat(el.getAttribute('data-base-price'));
                    const converted = (base * rates[curr]).toFixed(curr === 'DZD' ? 0 : 2);
                    el.textContent = `${converted} ${symbols[curr]}`;
                });
                localStorage.setItem('azador_currency', curr);
            });

            const cards = document.querySelectorAll('.product-card');
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach((entry, idx) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => entry.target.classList.add('visible'), idx * 150);
                        obs.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            cards.forEach(card => observer.observe(card));
        });
    </script>
</body>
</html>
