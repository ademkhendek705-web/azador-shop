<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZADOR | Old Money Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F9F6F0;
            --text-main: #2C221E;
            --accent-gold: #C5A059;
            --card-bg: #FFFFFF;
            --border-color: #E6DFD5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-img {
            max-width: 120px;
            height: auto;
            margin-bottom: 10px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            letter-spacing: 6px;
        }

        header p {
            font-size: 0.8rem;
            letter-spacing: 3px;
            opacity: 0.7;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .product-card .price {
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .btn-buy {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: var(--text-main);
            color: var(--bg-color);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        .btn-buy:hover {
            background: var(--accent-gold);
        }
    </style>
</head>
<body>

    <header>
        <img src="images/logo.jpg.jfif" alt="AZADOR Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>AZADOR</h1>
        <p>Old Money Aesthetics</p>
    </header>

    <div class="container">
        <div class="products-grid">

            <!-- Product 1 -->
            <div class="product-card">
                <img src="images/polo.jpg.jpg" alt="Classic Polo Navy">
                <h3>CLASSIC POLO - NAVY</h3>
                <div class="price">4500 DA</div>
                <a href="checkout.html?item=polo1" class="btn-buy">Commander</a>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <img src="images/polo1.jpg.jfif" alt="Classic Polo Ivory">
                <h3>CLASSIC POLO - IVORY</h3>
                <div class="price">4500 DA</div>
                <a href="checkout.html?item=polo2" class="btn-buy">Commander</a>
            </div>

            <!-- Product 3 -->
            <div class="product-card">
                <img src="images/polo2.jpg.jfif" alt="Classic Polo Espresso">
                <h3>CLASSIC POLO - ESPRESSO</h3>
                <div class="price">4500 DA</div>
                <a href="checkout.html?item=polo3" class="btn-buy">Commander</a>
            </div>

        </div>
    </div>

</body>
</html>
