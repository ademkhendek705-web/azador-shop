<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZADOR | Old Money Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* الثيم الافتراضي: Classic Ivory */
        :root {
            --bg-color: #F9F6F0;
            --text-main: #2C221E;
            --accent-gold: #C5A059;
            --card-bg: #FFFFFF;
            --border-color: #E6DFD5;
        }

        /* ثيم Midnight Navy */
        [data-theme="navy"] {
            --bg-color: #0F172A;
            --text-main: #F8FAFC;
            --accent-gold: #CBD5E1;
            --card-bg: #1E293B;
            --border-color: #334155;
        }

        /* ثيم Noir Dark */
        [data-theme="noir"] {
            --bg-color: #121212;
            --text-main: #E5E5E5;
            --accent-gold: #D4AF37;
            --card-bg: #1A1A1A;
            --border-color: #2A2A2A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
        }

        .top-bar select {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-img {
            max-width: 120px;
            height: auto;
            margin-bottom: 10px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            letter-spacing: 6px;
        }

        header p {
            font-size: 0.8rem;
            letter-spacing: 3px;
            opacity: 0.7;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .product-card .price {
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .btn-buy {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: var(--text-main);
            color: var(--bg-color);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            border-radius: 4px;
        }

        .btn-buy:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <label for="themeSelect">Thème: </label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="default">Classic Ivory</option>
                <option value="navy">Midnight Navy</option>
                <option value="noir">Noir Luxe</option>
            </select>
        </div>
        <div>
            <label for="currencySelect">Devise: </label>
            <select id="currencySelect" onchange="changeCurrency(this.value)">
                <option value="DZD">DZD (د.ج)</option>
                <option value="EUR">EUR (€)</option>
                <option value="USD">USD ($)</option>
            </select>
        </div>
    </div>

    <header>
        <img src="images/logo.jpg.jfif" alt="AZADOR Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>AZADOR</h1>
        <p>Old Money Collection</p>
    </header>

    <div class="container">
        <div class="products-grid">

            <!-- Produit 1 -->
            <div class="product-card">
                <img src="images/hoodie-black.png" alt="Essential Hoodie Black">
                <h3>ESSENTIAL HOODIE - BLACK</h3>
                <div class="price" data-dzd="6500">6500 DA</div>
                <a href="checkout.html?item=hoodie_black" class="btn-buy">Commander</a>
            </div>

            <!-- Produit 2 -->
            <div class="product-card">
                <img src="images/zip-navy.jpg" alt="Zip Hoodie Navy">
                <h3>ZIP HOODIE - NAVY</h3>
                <div class="price" data-dzd="7000">7000 DA</div>
                <a href="checkout.html?item=zip_navy" class="btn-buy">Commander</a>
            </div>

            <!-- Produit 3 -->
            <div class="product-card">
                <img src="images/zip-black.png" alt="Zip Hoodie Black">
                <h3>ZIP HOODIE - BLACK</h3>
                <div class="price" data-dzd="7000">7000 DA</div>
                <a href="checkout.html?item=zip_black" class="btn-buy">Commander</a>
            </div>

        </div>
    </div>

    <script>
        // تغيير ثيم الألوان
        function changeTheme(theme) {
            if (theme === 'default') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
        }

        // تحويل العملات تلقائياً
        const rates = {
            DZD: 1,
            EUR: 0.0068, // سعر تحويلي تقريبي
            USD: 0.0075
        };

        const symbols = {
            DZD: "DA",
            EUR: "€",
            USD: "$"
        };

        function changeCurrency(currency) {
            const priceElements = document.querySelectorAll('.price');
            priceElements.forEach(el => {
                const basePriceDZD = parseFloat(el.getAttribute('data-dzd'));
                if (currency === 'DZD') {
                    el.textContent = `${basePriceDZD} ${symbols.DZD}`;
                } else {
                    const converted = (basePriceDZD * rates[currency]).toFixed(2);
                    el.textContent = `${converted} ${symbols[currency]}`;
                }
            });
        }
    </script>
</body>
</html>
