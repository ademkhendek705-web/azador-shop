<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZADOR | Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F9F6F0;
            --text-main: #2C221E;
            --accent-gold: #C5A059;
            --card-bg: #FFFFFF;
            --border-color: #E6DFD5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .checkout-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-width: 800px;
            width: 100%;
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        @media (max-width: 650px) {
            .checkout-card { grid-template-columns: 1fr; }
        }

        .product-summary {
            text-align: center;
            border-right: 1px solid var(--border-color);
            padding-right: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 650px) {
            .product-summary { border-right: none; border-bottom: 1px solid var(--border-color); padding-right: 0; padding-bottom: 20px; }
        }

        .product-summary img {
            width: 100%;
            max-width: 220px;
            height: auto;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .product-summary h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .product-summary .price {
            color: var(--accent-gold);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #FAFAFA;
            font-family: inherit;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-submit:hover { background: var(--accent-gold); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.8rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="checkout-card">
        <div class="product-summary">
            <img id="product-img" src="images/polo.jpg" alt="Produit">
            <h2 id="product-title">CLASSIC POLO - NAVY</h2>
            <div id="product-price" class="price">4500 DA</div>
        </div>

        <div class="order-form">
            <form id="checkout-form">
                <div class="form-group">
                    <label for="name">Nom & Prénom</label>
                    <input type="text" id="name" required placeholder="Votre nom complet">
                </div>
                <div class="form-group">
                    <label for="phone">Numéro de Téléphone</label>
                    <input type="tel" id="phone" required placeholder="06 / 07 / 05 XXXXXXXX">
                </div>
                <div class="form-group">
                    <label for="wilaya">Wilaya</label>
                    <select id="wilaya" required>
                        <option value="">Sélectionnez votre Wilaya</option>
                        <option value="16">16 - Alger</option>
                        <option value="31">31 - Oran</option>
                        <option value="25">25 - Constantine</option>
                        <!-- اضف باقي الولايات هنا -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="address">Adresse de livraison</label>
                    <input type="text" id="address" required placeholder="Rue, Commune...">
                </div>
                <button type="submit" class="btn-submit">Confirmer la commande</button>
            </form>
            <a href="index.html" class="back-link">← Retour au catalogue</a>
        </div>
    </div>

    <script>
        const products = {
            'polo_navy': {
                title: 'CLASSIC POLO - NAVY',
                price: '4500 DA',
                img: 'images/polo.jpg'
            },
            'polo_ivory': {
                title: 'CLASSIC POLO - IVORY',
                price: '4500 DA',
                img: 'images/polo1.jpg'
            },
            'polo_espresso': {
                title: 'CLASSIC POLO - ESPRESSO',
                price: '4500 DA',
                img: 'images/polo2.jpg'
            },
            'hoodie_black': {
                title: 'ESSENTIAL HOODIE - BLACK',
                price: '6500 DA',
                img: 'images/hoodie-black.jpg'
            },
            'zip_navy': {
                title: 'ZIP HOODIE - NAVY',
                price: '7000 DA',
                img: 'images/zip-navy.jpg'
            },
            'zip_black': {
                title: 'ZIP HOODIE - BLACK',
                price: '7000 DA',
                img: 'images/zip-black.jpg'
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const itemKey = urlParams.get('item');

        if (itemKey && products[itemKey]) {
            document.getElementById('product-title').innerText = products[itemKey].title;
            document.getElementById('product-price').innerText = products[itemKey].price;
            document.getElementById('product-img').src = products[itemKey].img;
        }
    </script>
</body>
</html>
