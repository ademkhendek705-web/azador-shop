<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZADOR | Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F9F6F0;
            --text-main: #2C221E;
            --accent-gold: #C5A059;
            --card-bg: #FFFFFF;
            --border-color: #E6DFD5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 40px 20px;
        }

        .checkout-container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(44, 34, 30, 0.05);
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }

        .header-title {
            grid-column: 1 / -1;
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            letter-spacing: 3px;
        }

        .summary-box {
            background-color: #F8F5F0;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .summary-box img {
            max-width: 180px;
            height: auto;
            margin-bottom: 15px;
            mix-blend-mode: multiply;
        }

        .product-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-price {
            color: var(--accent-gold);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: #555;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            background-color: #FFF;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-gold);
        }

        .btn-confirm {
            width: 100%;
            padding: 14px;
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-confirm:hover {
            background-color: var(--accent-gold);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #777;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="header-title">
            <h1>AZADOR</h1>
            <p style="font-size: 0.8rem; letter-spacing: 2px; color: #777;">FINALISER VOTRE COMMANDE</p>
        </div>

        <!-- Summary Product -->
        <div class="summary-box">
            <img id="item-img" src="images/polo.jpg.jpg" alt="Polo AZADOR">
            <div id="item-title" class="product-title">CLASSIC POLO - NAVY</div>
            <div id="item-price" class="product-price">4500 DA</div>
            <p style="font-size: 0.75rem; color: #888; margin-top: 15px;">Paiement à la livraison (Paiement Cash à la réception)</p>
        </div>

        <!-- Form -->
        <div>
            <form id="checkoutForm">
                <div class="form-group">
                    <label>Nom & Prénom</label>
                    <input type="text" placeholder="Votre nom complet" required>
                </div>

                <div class="form-group">
                    <label>Numéro de Téléphone</label>
                    <input type="tel" placeholder="06 / 07 / 05 XXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label>Wilaya</label>
                    <select required>
                        <option value="">Sélectionnez votre Wilaya</option>
                        <option value="16">16 - Alger</option>
                        <option value="31">31 - Oran</option>
                        <option value="25">25 - Constantine</option>
                        <option value="09">09 - Blida</option>
                        <option value="15">15 - Tizi Ouzou</option>
                        <option value="19">19 - Sétif</option>
                        <option value="06">06 - Béjaïa</option>
                        <!-- زيد باقي الولايات هنا -->
                    </select>
                </div>

                <div class="form-group">
                    <label>Adresse de livraison</label>
                    <input type="text" placeholder="Rue, Commune, Cité..." required>
                </div>

                <button type="submit" class="btn-confirm">Confirmer la Commande</button>
            </form>
            <a href="index.html" class="back-link">← Retour au catalogue</a>
        </div>
    </div>

    <script>
        // JS لمعرفة أي منتج تم اختياره من خلال رابط URL
        const urlParams = new URLSearchParams(window.location.search);
        const item = urlParams.get('item');

        const products = {
            'polo1': { title: 'CLASSIC POLO - NAVY', price: '4500 DA', img: 'images/polo.jpg.jpg' },
            'polo2': { title: 'CLASSIC POLO - IVORY', price: '4500 DA', img: 'images/polo1.jpg.jfif' },
            'polo3': { title: 'CLASSIC POLO - ESPRESSO', price: '4500 DA', img: 'images/polo2.jpg.jfif' }
        };

        if (item && products[item]) {
            document.getElementById('item-title').innerText = products[item].title;
            document.getElementById('item-price').innerText = products[item].price;
            document.getElementById('item-img').src = products[item].img;
        }

        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Votre commande a été enregistrée avec succès ! Merci d\'avoir choisi AZADOR.');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
